name: 'Work&Hive Issue Template'
description: 'Work&Hive 프로젝트의 이슈 템플릿입니다. (*필수)'
title: '이슈 이름을 작성해주세요'
body:
  - type: dropdown
    id: type
    attributes:
      label: '🚀 Issue Type'
      description: '작업 유형을 선택해주세요'
      options:
        - '기능 추가/수정'
        - '버그 수정'
        - '환경 설정/빌드 관련'
        - '의존성 업데이트'
        - '문서/가이드 수정'
        - '기타'
      default: 0
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: '✅ 작업 목록'
      description: '필수 작업 목록을 작성해주세요'
      value: |
        - [ ] Task1
        - [ ] Task2
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: '📝 상세 내용(Description)'
      description: '이슈에 대해서 간략히 설명해주세요'
    validations:
      required: true

