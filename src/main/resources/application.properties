spring.application.name=app

### Logging
logging.level.root=INFO
logging.level.workhive.app=INFO
logging.level.org.apache.coyote.http11=INFO
logging.level.org.springframework.web=INFO
logging.level.org.quartz=INFO
logging.level.org.springframework.batch=INFO
logging.level.org.springframework.cache=INFO

### Redis Setting
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DB}

### Mysql Setting
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

### JPA Setting
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.connection.isolation=2
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
#\uD2B8\uB79C\uC7AD\uC158 \uC678\uBD80\uC5D0\uC11C \uC870\uD68C \uC2DC LazyLoading \uC744 \uD5C8\uC6A9\uD558\uC9C0 \uC54A\uC74C
spring.jpa.open-in-view=false

### Server Setting
server.shutdown=graceful

### Swagger Setting
springdoc.api-docs.path=/api-docs/json
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/api-docs.html
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

# JWT
spring.jwt.secret-key=${JWT_SECRET_KEY}