spring.profiles.active=test

spring.config.import=optional:file:.env[.properties]

### Redis Setting
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DB:0}

### Mysql Setting
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:workhive}?serverTimezone=Asia/Seoul&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

### JPA Setting
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.connection.isolation=2
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
#\uD2B8\uB79C\uC7AD\uC158 \uC678\uBD80\uC5D0\uC11C \uC870\uD68C \uC2DC LazyLoading \uC744 \uD5C8\uC6A9\uD558\uC9C0 \uC54A\uC74C
spring.jpa.open-in-view=false

# JWT
jwt.secret.key=${JWT_SECRET_KEY}
jwt.access.expire=1800000
jwt.refresh.expire=604800000